name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - dev

jobs:
  backend:
    name: Backend — Python unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # Integration tests require real credentials — skipped in CI
        run: pytest tests/unit/ -v --tb=short
        env:
          # Stub values — unit tests mock all external calls
          SUPABASE_URL: https://ci-stub.supabase.co
          SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-key
          OPENROUTER_API_KEY: sk-or-ci-stub
          ELEVENLABS_API_KEY: ci-el-stub
          JARVIS_DEMO: "true"
          APP_ENV: development

  frontend:
    name: Frontend — TypeScript build + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
